name: Build

# Every push builds the universal .saver. A push to main (or a v* tag) also publishes it as a GitHub release;
# main releases are tagged v1.0.<run number>.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Release version: the tag itself, or v1.0.<run number> for main builds. Used in the zip name and bundle version.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd macos && xcodegen

      - name: Build screensaver (Release, universal)
        run: |
          xcodebuild \
            -project macos/FootballScreensaver.xcodeproj \
            -scheme Football \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION#v}" \
            build

      - name: Ad-hoc sign and package
        run: |
          set -euo pipefail
          SAVER="build/Build/Products/Release/Football.saver"
          codesign --force --deep --sign - "$SAVER"
          lipo -info "$SAVER/Contents/MacOS/Football"
          mkdir -p dist
          ditto -c -k --keepParent "$SAVER" "dist/Football-${VERSION}.saver.zip"

      - name: Render layer tree headless (snapshot check)
        run: |
          set -euo pipefail
          mkdir -p dist/snapshots
          swiftc -parse-as-library -O macos/Saver/Match.swift macos/Saver/Art.swift macos/Saver/Broadcast.swift macos/Saver/HUD.swift \
            macos/Tools/Snapshot.swift -o build/snapshot
          build/snapshot dist/snapshots

      - name: Publish snapshots to the ci-snapshots branch
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          cd dist/snapshots
          git init -q && git checkout -q -b ci-snapshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Snapshots for ${{ github.sha }}" --allow-empty
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Snapshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.sha }}
          path: dist/snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: Football-saver-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build-macos
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Football-saver-${{ github.sha }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
