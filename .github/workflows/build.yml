name: Build

# Every push builds the universal .saver. A push to main (or a v* tag) also publishes it as a GitHub release;
# main releases are tagged v1.0.<run number>.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Release version: the tag itself, or v1.0.<run number> for main builds. Used in the zip name and bundle version.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd macos && xcodegen

      - name: Build screensaver (Release, universal)
        run: |
          xcodebuild \
            -project macos/FootballScreensaver.xcodeproj \
            -scheme Football \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION#v}" \
            build

      - name: Ad-hoc sign and package
        run: |
          set -euo pipefail
          SAVER="build/Build/Products/Release/Football.saver"
          codesign --force --deep --sign - "$SAVER"
          lipo -info "$SAVER/Contents/MacOS/Football"
          mkdir -p dist
          STAGE=$(mktemp -d)
          cp -R "$SAVER" "$STAGE/Football-${VERSION}.saver"
          ditto -c -k --keepParent "$STAGE/Football-${VERSION}.saver" "dist/Football-${VERSION}.saver.zip"
          unzip -l "dist/Football-${VERSION}.saver.zip" | head -5

      - name: Render layer tree headless (snapshot check)
        run: |
          set -euo pipefail
          mkdir -p dist/snapshots
          swiftc -parse-as-library -O macos/Saver/Match.swift macos/Saver/Art.swift macos/Saver/Broadcast.swift macos/Saver/HUD.swift \
            macos/Tools/Snapshot.swift -o build/snapshot
          build/snapshot dist/snapshots

      - name: Publish snapshots to the ci-snapshots branch
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          cd dist/snapshots
          git init -q && git checkout -q -b ci-snapshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Snapshots for ${{ github.sha }}" --allow-empty
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Snapshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.sha }}
          path: dist/snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: Football-saver-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --console=plain

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Football-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Football-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an emulator (activity + live wallpaper preview screenshots, crash check)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash android/ci/emulator-test.sh "dist/Football-${{ env.VERSION }}.apk" dist/android-snapshots

      - name: Publish emulator screenshots to the ci-snapshots-android branch
        if: always() && github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          cd dist/android-snapshots
          git init -q && git checkout -q -b ci-snapshots-android
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android snapshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-snapshots-android

  release:
    needs: [build-macos, build-android]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Football-saver-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Football-apk-${{ github.sha }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.apk
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
