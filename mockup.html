<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Screensaver</title>
<meta name="description" content="Animated mockup of a macOS screensaver that shows a simulated football match as a live TV broadcast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#6fb3e6,#b9dcf3 45%,#47983d 46%)}
.plane{position:absolute;left:0;top:0;transform-origin:0 0}
#fx{position:absolute;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font:600 clamp(13px,1.45vw,24px) 'Barlow Condensed',sans-serif;color:#fff;letter-spacing:.03em}
#bug{position:absolute;left:3vw;top:max(3.5vh,12px);display:flex;height:1.9em;box-shadow:0 .2em .6em rgba(0,0,0,.45)}
#bug>div{display:flex;align-items:center;padding:0 .55em;background:rgba(10,18,38,.92)}
#bug i{display:block;width:.28em;height:1.15em}
#bug .t b{margin:0 .4em;font-weight:700}
#bug .s{background:#f1f3f8;color:#0a1226;font-weight:700;min-width:2.9em;justify-content:center;font-variant-numeric:tabular-nums}
#bug .c{background:#1c2a4f;min-width:3em;justify-content:center;font-variant-numeric:tabular-nums}
#bug .a{background:#d61f45;display:none}
#bug .a.on{display:flex}
#live{position:absolute;right:3vw;top:max(3.5vh,12px);height:1.9em;display:flex;align-items:center;gap:.4em;padding:0 .6em;background:rgba(10,18,38,.75);font-weight:700}
#live i{width:.55em;height:.55em;border-radius:50%;background:#e11d48;animation:blink 1.6s infinite}
#live.rp{background:#d61f45}
#live.rp i{animation:none;background:#fff}
#wipe{position:absolute;top:-10%;bottom:-10%;left:-30%;width:160%;transform:translateX(-120%) skewX(-12deg);background:linear-gradient(90deg,#d61f45 0 6%,#0a1226 6% 94%,#d61f45 94%);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(32px,7vw,110px);letter-spacing:.25em}
#wipe.go{animation:wipe .6s cubic-bezier(.6,0,.4,1)}
@keyframes wipe{0%{transform:translateX(-120%) skewX(-12deg)}40%,60%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(120%) skewX(-12deg)}}
@keyframes blink{50%{opacity:.25}}
#lower{position:absolute;left:3vw;bottom:9vh;display:flex;max-width:94vw;transform:translateX(-130%);transition:transform .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 .2em .8em rgba(0,0,0,.5)}
#lower.on{transform:none}
#lower .tag{background:#d61f45;font-weight:700;font-size:2.3em;padding:0 .45em;display:flex;align-items:center}
#lower .txt{background:rgba(10,18,38,.94);padding:.4em .9em;white-space:nowrap;overflow:hidden}
#l1{font-weight:700;font-size:1.35em}
#l2{opacity:.8}
#card{position:absolute;left:50%;top:50%;min-width:15em;transform:translate(-50%,-46%);opacity:0;transition:.45s;background:rgba(10,18,38,.95);box-shadow:0 .3em 1.4em rgba(0,0,0,.6)}
#card.on{opacity:1;transform:translate(-50%,-50%)}
#card .h{background:#1c2a4f;padding:.35em .8em;font-weight:700;letter-spacing:.12em;text-align:center}
#card .r{display:flex;align-items:center;gap:.6em;padding:.4em .8em;font-size:1.3em}
#card .r i{width:.3em;height:1.1em}
#card .r span{flex:1}
#card .r b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage"><canvas id="fx"></canvas></div>
<div id="hud">
  <div id="bug">
    <div class="t"><i id="k0"></i><b id="n0"></b></div>
    <div class="s"><span id="s0"></span>&nbsp;–&nbsp;<span id="s1"></span></div>
    <div class="t"><b id="n1"></b><i id="k1"></i></div>
    <div class="c" id="clk"></div>
    <div class="a" id="add"></div>
  </div>
  <div id="live"><i></i><span id="lv">LIVE</span></div>
  <div id="lower"><div class="tag">GOAL</div><div class="txt"><div id="l1"></div><div id="l2"></div></div></div>
  <div id="wipe">REPLAY</div>
  <div id="card"><div class="h" id="ch"></div><div class="r"><i id="ck0"></i><span id="cn0"></span><b id="cs0"></b></div><div class="r"><i id="ck1"></i><span id="cn1"></span><b id="cs1"></b></div></div>
</div>
<script>
// ---------- maths ----------
const TAU=Math.PI*2,G=9.81,rnd=Math.random,R=(a,b)=>a+rnd()*(b-a),RI=n=>rnd()*n|0,pick=a=>a[RI(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot,sgn=v=>v<0?-1:1;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const nrm=a=>{const l=hyp(...a);return a.map(v=>v/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),cdist=(a,b)=>hyp(...sub(hex(a),hex(b)));
const shade=(h,f)=>'#'+hex(h).map(v=>Math.round(v*f).toString(16).padStart(2,'0')).join('');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const $=id=>document.getElementById(id);

// ---------- data (fictional clubs) ----------
const TEAMS=[
 {name:'Northbridge',code:'NBR',kit:['#c8102e','#ffffff','#c8102e']},
 {name:'Castleford Athletic',code:'CAS',kit:['#1d4ed8','#1d4ed8','#ffffff']},
 {name:'Harbour City',code:'HBC',kit:['#8fd3f4','#ffffff','#0b1f44']},
 {name:'Redmoor Rovers',code:'RMR',kit:['#f4f4f4','#111111','#f4f4f4']},
 {name:'Ashvale United',code:'ASH',kit:['#fcd116','#111111','#fcd116']},
 {name:'Kingsport',code:'KSP',kit:['#6d28d9','#ffffff','#6d28d9']},
 {name:'Westmere Town',code:'WMT',kit:['#7a1f3d','#8fd3f4','#7a1f3d']},
 {name:'Stoneham',code:'STH',kit:['#f97316','#111111','#f97316']}];
const GKKITS=[['#a3e635','#111111','#a3e635'],['#ec4899','#111111','#ec4899'],['#06b6d4','#0b1f44','#06b6d4'],['#222222','#222222','#222222'],['#facc15','#facc15','#facc15']];
const NAMES=['Parker','Okafor','Lindqvist','Moreau','Silva','Novak','Brennan','Haddad','Kowalski','Tanaka','Reyes','Fischer','Adeyemi','Costa','Murphy','Ivanov','Duarte','Walsh','Kim','Bauer','Mensah','Rossi','Varga','Holm','Quinn','Sato','Nkemelu','Petit','Byrne','Moreno','Larsen','Dvořák'];
const NUMS=[1,2,5,6,3,7,8,4,11,9,10];
// 4-4-2 shape for a team attacking +x (metres; pitch is 105×68, centre at 0,0)
const FORM=[[-49,0],[-33,-22],[-36,-8],[-36,8],[-33,22],[-15,-23],[-18,-7],[-18,7],[-15,23],[-3,-7],[-5,8]];

// ---------- sprites: 12 run + 8 walk frames + idle per kit/look, drawn facing right ----------
const SW=24,SH=48,SS=3,SKIN=['#f1c7a5','#c68a5d','#7a4a2c'],LOOKS=[['#f1c7a5','#2a1a10'],['#f1c7a5','#b88a4a'],['#c68a5d','#111111'],['#7a4a2c','#111111']];
const RUNF=12,WALKF=8,IDLE=RUNF+WALKF,sm=v=>(1-Math.cos(Math.PI*v))/2;
// one leg's [thigh, knee flex] in radians (+ = forward) at cycle position u, 0 = foot strike
function gait(u,run){
  const ST=run?.38:.6,T=run?[.45,-.55]:[.32,-.3];
  if(u<ST){const s=u/ST;return[T[0]+(T[1]-T[0])*s,(run?.3:.08)+(run?.28:.1)*Math.sin(s*Math.PI)]}
  const s=(u-ST)/(1-ST);
  return[T[1]+(T[0]-T[1])*sm(s)+(run?.4:.08)*Math.sin(Math.PI*s)**2,(run?.3:.08)+(run?1.55:.9)*Math.sin(Math.PI*s**.75)**1.4];
}
function figure(x,k,skin,hair,fr){
  const run=fr<RUNF,walk=fr>=RUNF&&fr<IDLE,u=run?fr/RUNF:(fr-RUNF)/WALKF,L=8.6;
  const legs=[1,0].map(back=>{const[th,kn]=run||walk?gait((u+back*.5)%1,run):[back?-.1:.1,.12],ps=th-kn,
    knee=[L*Math.sin(th),L*Math.cos(th)];return{back,ps,knee,foot:[knee[0]+L*Math.sin(ps),knee[1]+L*Math.cos(ps)]}});
  // lowest foot on the ground (stance knee flex gives the bob), plus a short flight phase between running strides
  const u2=u*2%1,hy=46-Math.max(...legs.map(l=>l.foot[1]))-(run&&u2>.76?1.1*Math.sin((u2-.76)/.24*Math.PI):0);
  x.lineCap='round';x.translate(12,hy);
  const seg=(a,b,c,w)=>{x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke()};
  const leg=({back,ps,knee,foot})=>{const f=back?.72:1,gr=foot[1]+hy>45.6,al=gr?0:clamp(-ps*.9,-.3,1),d=[Math.cos(al),Math.sin(al)];
    seg([0,0],knee,shade(skin,f),3.4);seg(knee,foot,shade(k[2],f),2.9);
    seg([foot[0]-.8*d[0],foot[1]-.8*d[1]],[foot[0]+2.4*d[0],foot[1]+2.4*d[1]],back?'#000':'#161616',2.3)};
  const arm=back=>{const a=run?-.6*Math.cos(u*TAU)*(back?-1:1)+.1:walk?-.3*Math.cos(u*TAU)*(back?-1:1):.08,sh=[0,-16],
    el=[sh[0]+5.5*Math.sin(a),sh[1]+5.5*Math.cos(a)],be=a+(run?1.45:walk?.5:.15),hd=[el[0]+5*Math.sin(be),el[1]+5*Math.cos(be)],f=back?.72:1;
    seg(sh,el,shade(skin,f),2.4);seg(el,hd,shade(skin,f),2.2);seg(sh,[sh[0]+2.6*Math.sin(a),sh[1]+2.6*Math.cos(a)],shade(k[0],f),3)};
  const lean=run?.14:walk?.03:0;
  x.save();x.rotate(lean);arm(1);x.restore();
  legs.forEach(leg);
  x.rotate(lean);
  x.fillStyle=k[1];x.fillRect(-4,-4.5,8,6);
  x.fillStyle=k[0];x.beginPath();x.roundRect(-4.5,-18.5,9,15,2.5);x.fill();
  x.fillStyle='rgba(0,0,0,.18)';x.fillRect(-4.5,-18.5,2,15);
  arm(0);
  x.fillStyle=skin;x.beginPath();x.arc(.5,-22.3,3.6,0,TAU);x.fill();
  x.fillStyle=hair;x.beginPath();x.arc(.3,-22.9,3.7,Math.PI*.95,Math.PI*2.1);x.fill();
}
let SPR={};
function sprites(key,kit){SPR[key]=LOOKS.map(([s,h])=>Array.from({length:IDLE+1},(_,f)=>{const c=mk(SW*SS,SH*SS),x=c.getContext('2d');x.scale(SS,SS);figure(x,kit,s,h,f);return c}))}

// ---------- static textures (rasterised once) ----------
const PPM=14,X0=-62,X1=62,Y0=-40,Y1=40;
// world rect x0..x1, y0..y1 at ppm px/m (the full pitch, or a sharper crop of one goal end for the replay camera)
function pitchTex(ppm,x0,x1,y0,y1){
  const c=mk((x1-x0)*ppm,(y1-y0)*ppm),x=c.getContext('2d');
  x.setTransform(ppm,0,0,-ppm,-x0*ppm,y1*ppm);
  x.fillStyle='#47983d';x.fillRect(X0,Y0,X1-X0,Y1-Y0);
  for(let i=-2;i<22;i++){x.fillStyle=i&1?'#44943a':'#47983d';x.fillRect(-52.5+i*5.25,Y0,5.25,Y1-Y0)}
  x.fillStyle='rgba(0,0,0,.13)';x.fillRect(X0,Y0,X1-X0,-34-Y0);x.fillRect(X0,34,X1-X0,Y1-34);x.fillRect(X0,-34,-52.5-X0,68);x.fillRect(52.5,-34,X1-52.5,68);
  for(let i=(x1-x0)*(y1-y0)*6;i>0;i--){x.fillStyle=rnd()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.05)';x.fillRect(R(x0,x1),R(y0,y1),.12,.12)}
  x.strokeStyle='rgba(255,255,255,.93)';x.lineWidth=.12;x.fillStyle='#fff';
  const circ=(cx,cy,r,a,b)=>{x.beginPath();x.arc(cx,cy,r,a,b);x.stroke()},spot=(cx,cy)=>{x.beginPath();x.arc(cx,cy,.15,0,TAU);x.fill()};
  x.strokeRect(-52.5,-34,105,68);x.beginPath();x.moveTo(0,-34);x.lineTo(0,34);x.stroke();circ(0,0,9.15,0,TAU);spot(0,0);
  const a=Math.acos(5.5/9.15);
  for(const s of[-1,1]){
    x.strokeRect(s>0?36:-52.5,-20.16,16.5,40.32);x.strokeRect(s>0?47:-52.5,-9.16,5.5,18.32);spot(s*41.5,0);
    s>0?circ(41.5,0,9.15,Math.PI-a,Math.PI+a):circ(-41.5,0,9.15,-a,a);
    for(const t of[-1,1]){const a0=Math.atan2(-t,-s);circ(s*52.5,t*34,1,a0-Math.PI/4,a0+Math.PI/4)}
  }
  return c;
}
function crowdTex(wm,hm,kits,jump){
  const P=8,c=mk(wm*P,hm*P),x=c.getContext('2d'),rh=.85,cols=['#d9d9d9','#3b3f4a','#23395d','#555555','#c9b27c','#2d2d2d','#6b2020','#1f3b2a'];
  for(let r=0;r*rh<hm;r++){
    const y=r*rh*P;x.fillStyle=r&1?'#2b2f39':'#262a33';x.fillRect(0,y,c.width,rh*P);
    for(let s=0;s*.55<wm;s++){if(rnd()<.09)continue;
      const px=(s*.55+R(-.08,.08))*P,up=jump&&rnd()<.6?.18*P:0,v=rnd();
      x.fillStyle=v<.3?kits[0]:v<.45?kits[1]:pick(cols);x.fillRect(px-.2*P,y+.36*P-up,.4*P,.45*P);
      x.fillStyle=pick(SKIN);x.beginPath();x.arc(px,y+.26*P-up,.12*P,0,TAU);x.fill();
      if(up&&rnd()<.5){x.fillStyle=x.fillStyle;x.fillRect(px-.28*P,y+.02*P-up,.06*P,.3*P)}
    }
  }
  const gr=x.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,'rgba(0,0,0,.35)');gr.addColorStop(.35,'rgba(0,0,0,.08)');gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr;x.fillRect(0,0,c.width,c.height);
  return c;
}
const ADS=[['NORTHSTAR BANK','#0b3d91','#fff'],['KICK COLA','#d61f45','#fff'],['VOLTA ENERGY','#111','#facc15'],['ORBIT AIR','#f4f4f4','#0b3d91'],['FIELDLINE','#0f7a3a','#fff'],['PENSIVE TYRES','#facc15','#111']];
function boardTex(c,wm,off){
  const P=24,x=c.getContext('2d');c.width=wm*P;c.height=.9*P;
  x.font=`700 ${.62*P}px 'Barlow Condensed',sans-serif`;x.textAlign='center';x.textBaseline='middle';
  for(let i=0;i*8<wm;i++){const[t,b,f]=ADS[(i+off)%ADS.length];x.fillStyle=b;x.fillRect(i*8*P,0,8*P,c.height);x.fillStyle=f;x.fillText(t,(i*8+4)*P,c.height/2+1)}
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,c.height-2,c.width,2);
}

// ---------- world planes: texture px -> world metres, shown via one 3D transform each ----------
const SL=35*Math.PI/180,SC=Math.cos(SL),SN=Math.sin(SL),STAND=34;
let PLANES=[];
function plane(els,O,U,V,ppmU,ppmV,tag='main'){
  const SU=U.map(v=>v/ppmU),SV=V.map(v=>v/ppmV),N=nrm(cross(SU,SV)),w=els[0].width,h=els[0].height;
  for(const e of els){e.className='plane';e.style.width=w+'px';e.style.height=h+'px';$('stage').insertBefore(e,$('fx'))}
  const at=(u,v)=>[O[0]+SU[0]*u+SV[0]*v,O[1]+SU[1]*u+SV[1]*v,O[2]+SU[2]*u+SV[2]*v];
  const p={els,tag,O,SU,SV,N,corners:[at(0,0),at(w,0),at(0,h),at(w,h)]};PLANES.push(p);return p;
}
let boards=[];
function buildWorld(k0,k1){
  $('stage').querySelectorAll('.plane').forEach(e=>e.remove());PLANES=[];boards=[];
  const kits=[k0,k1],cw=(w,h)=>[crowdTex(w,h,kits,0),crowdTex(w,h,kits,1)];
  plane(cw(150,STAND),[-75,40+STAND*SC,STAND*SN],[1,0,0],[0,-SC,-SN],8,8);
  plane(cw(80,STAND),[-62-STAND*SC,-40,STAND*SN],[0,1,0],[SC,0,-SN],8,8,'e-1');
  plane(cw(80,STAND),[62+STAND*SC,40,STAND*SN],[0,-1,0],[-SC,0,-SN],8,8,'e1');
  plane([pitchTex(PPM,X0,X1,Y0,Y1)],[X0,Y1,0],[1,0,0],[0,-1,0],PPM,PPM);
  for(const s of[-1,1]){const a=s>0?40:-62;plane([pitchTex(32,a,a+22,-28,40)],[a,40,0],[1,0,0],[0,-1,0],32,32,'c'+s)}
  const bd=(wm,O,U,tag)=>{const c=mk(1,1);boardTex(c,wm,0);boards.push([c,wm]);plane([c],O,U,[0,0,-1],24,24,tag)};
  bd(120,[-60,37.5,.9],[1,0,0]);bd(48,[-57,-24,.9],[0,1,0],'e-1');bd(48,[57,24,.9],[0,-1,0],'e1');
}

// ---------- camera: broadcast gantry on the near side, panning and dollying with play ----------
let VW,VH,DPR,F0,F,CX,CY,V;
const fx=$('fx'),g=fx.getContext('2d');
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;fx.width=VW*DPR;fx.height=VH*DPR;CX=VW/2;CY=VH/2;F0=Math.max(VW,VH*1.3)/(2*Math.tan(19*Math.PI/180))}
addEventListener('resize',resize);
const cam={x:0,y:0,z:1,ry:0};
function basis(C,T){const f=nrm(sub(T,C)),r=nrm(cross(f,[0,0,1]));return{C,f,r,u:cross(r,f)}}
// replay: low camera on the pitch in front of the scoring goal, facing the net; only that end's planes are shown
const replaySide=()=>M.phase==='replay'?sgn(M.celeb[0]):0,shown=p=>{const s=replaySide();return s?p.tag==='e'+s||p.tag==='c'+s:p.tag[0]!=='c'};
function view(){
  const s=replaySide();
  if(s){V=basis([s*31,-5,2.4],[s*53,cam.ry,1]);F=F0*1.5;return}
  const C=[cam.x*.55,-60,25];let T=[cam.x,cam.y+5-9*clamp(VH/VW-.7,0,1),0],b=basis(C,T);
  // keep every plane corner well in front of the lens (Core Animation / CSS both misbehave at w<=0)
  const ok=b=>PLANES.every(p=>!shown(p)||p.corners.every(q=>dot(sub(q,C),b.f)>4));
  for(let lo=0,hi=1,i=0;!ok(b)&&i<12;i++){const m=(lo+hi)/2;hi=m;b=basis(C,[C[0]+(T[0]-C[0])*m,T[1],0]);if(ok(b))break}
  V=b;F=F0*cam.z;
}
function proj(x,y,z){const d=[x-V.C[0],y-V.C[1],z-V.C[2]],zc=dot(d,V.f);return[CX+F*dot(d,V.r)/zc,CY-F*dot(d,V.u)/zc,zc]}
function css(p){
  const col=(v,t)=>{const xc=dot(v,V.r),yc=dot(v,V.u),zc=dot(v,V.f);return[F*xc+CX*zc,-F*yc+CY*zc,t,zc]};
  return`matrix3d(${[...col(p.SU,0),...col(p.SV,0),...col(p.N,0),...col(sub(p.O,V.C),1)].join(',')})`;
}

// ---------- match ----------
let M;
const B=()=>M.ball;
function newMatch(first){
  let a=RI(TEAMS.length),b;do b=RI(TEAMS.length);while(b===a||cdist(TEAMS[a].kit[0],TEAMS[b].kit[0])<170);
  const ta=TEAMS[a],tb=TEAMS[b],used=[ta.kit[0],tb.kit[0]];
  const gks=GKKITS.filter(k=>used.every(u=>cdist(u,k[0])>150)),ref=used.some(u=>cdist(u,'#111111')<120)?['#facc15','#111111','#111111']:['#111111','#111111','#111111'];
  SPR={};sprites(0,ta.kit);sprites(1,tb.kit);sprites(2,gks[0]);sprites(3,gks[1]||GKKITS[3]);sprites(4,ref);
  const names=[...NAMES].sort(()=>rnd()-.5);
  const team=(d,dir,t)=>({...d,dir,score:0,players:FORM.map((f,i)=>({t,i,x:f[0]*dir,y:f[1],vx:0,vy:0,ph:R(0,TAU),face:dir,stun:0,num:NUMS[i],name:names[t*11+i],kit:i?t:2+t,look:RI(4),wob:R(0,99)}))});
  M={teams:[team(ta,1,0),team(tb,-1,1)],time:0,half:1,added:1+RI(4),clock:0,phase:'play',
     ball:{x:0,y:0,z:0,vx:0,vy:0,vz:0,owner:null,last:0,kicker:null,kickT:0,shot:null,recv:null},
     ref:{x:-6,y:-9,vx:0,vy:0,ph:0,face:1,kit:4,look:RI(4),i:-1,t:-1,stun:0}};

  g.save();g.translate(pf[0],pf[1]-46*sc);g.scale(p.face,1);g.drawImage(spr,-w/2,0,w,h);g.restore();
}
function drawBall(b,bp){
  const r=Math.max(1.3,F*.11/bp[2]),sh=proj(b.x,b.y,0);
  g.fillStyle=`rgba(0,0,0,${.35/(1+b.z*.4)})`;g.beginPath();g.ellipse(sh[0],sh[1],r*1.1,r*.4,0,0,TAU);g.fill();
  const gr=g.createRadialGradient(bp[0]-r*.3,bp[1]-r*.3,r*.1,bp[0],bp[1],r);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#b9bec6');
  g.fillStyle=gr;g.beginPath();g.arc(bp[0],bp[1],r,0,TAU);g.fill();
}
function drawGoal(s){
  const x0=s*52.5,x1=s*54.5,line=(pts,w,c)=>{const q=pts.map(p=>proj(...p));g.strokeStyle=c;g.lineWidth=Math.max(.6,F*w/q[0][2]);g.beginPath();q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()};
  g.lineCap='round';
  for(let y=-3.66;y<=3.67;y+=.61){line([[x0,y,2.44],[x1,y,1.9],[x1,y,0]],.025,'rgba(255,255,255,.35)')}
  for(let z=0;z<=2;z+=.4){line([[x0,-3.66,Math.min(2.44,z*1.22)],[x1,-3.66,z],[x1,3.66,z],[x0,3.66,Math.min(2.44,z*1.22)]],.025,'rgba(255,255,255,.3)')}
  line([[x0,-3.66,0],[x0,-3.66,2.44],[x0,3.66,2.44],[x0,3.66,0]],.12,'#fff');
}

// ---------- loop ----------
let last=0,acc=0,boardT=0,boardOff=0;
function frame(ts){
  const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;acc+=dt;
  while(acc>=1/60){step(1/60);acc-=1/60}
  if((boardT+=dt)>10){boardT=0;boardOff++;for(const[c,wm]of boards)boardTex(c,wm,boardOff)}
  render(dt);hud();requestAnimationFrame(frame);
}
function init(){resize();newMatch(true);requestAnimationFrame(frame)}
document.fonts.load("700 20px 'Barlow Condensed'").then(init,init);
</script>
