plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iund.football'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iund.football'
        // Android 3.2 (Honeycomb) is API 13.
        //noinspection MinSdkTooLow
        minSdk 13
        //noinspection ExpiredTargetSdkVersion
        targetSdk 13
        versionCode 1
        versionName(System.getenv('VERSION')?.replaceFirst('^v', '') ?: '1.0')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // CI runs lintDebug: any API newer than minSdk 13 (Android 3.2) fails the build.
    lint {
        checkOnly 'NewApi'
        error 'NewApi'
        abortOnError true
    }
}
